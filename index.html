<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة لفاطمة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:linear-gradient(135deg,#ff5a8a,#ff006a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:360px;padding:25px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{color:#ff006a}
input{width:100%;padding:13px;border:2px solid #ffd1de;border-radius:12px;margin:15px 0;text-align:center;font-size:16px;outline:none}
button{width:100%;padding:12px;background:#ff006a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
#msg{display:none;margin-top:20px;background:#fff5f7;padding:15px;border-radius:12px;line-height:1.8;color:#333}
#error{color:red;display:none;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 رسالة سرية</h1>
  <p style="color:#888;font-size:13px">اكتبي الباسورد عشان تشوفي الرسالة</p>
  <p style="font-size:12px;color:#ff006a">تلميح: اسمك 😏</p>
  <input type="password" id="pass" placeholder="اكتبي الباسورد هنا">
  <button onclick="check()">افتحي الرسالة</button>
  <div id="error">الباسورد غلط يا فاطمة 😂</div>
  
  <div id="msg">
    بصي يا <b>فاطمة</b> 😂<br><br>
    انتي انسانة جميلة وكويسه والله ❤️<br>
    بس لسانك طويل شبرين 😜<br><br>
    ذاكري شوية وخلي عندك دم 😂😂
هتشل منك😂😂😂<br>
    <br> - من Moka
  </div>
</div>

<script>
function check(){
  let p = document.getElementById('pass').value.trim();
  if(p === 'فاطمة' || p === 'fatma' || p === 'Fatma' || p === 'Fاطمة'){
    document.getElementById('msg').style.display='block';
    document.getElementById('error').style.display='none';
  }else{
    document.getElementById('error').style.display='block';
  }
}
</script>
</div>
</body>
</html>
